[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artesian"
version = "0.1.0"
description = "Retrieval and knowledge foundation: search engines, HTML parsing backend compat, embeddings, knowledge base"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "orjson>=3.0",              # fast_json 的加速路径；缺失时回退标准库 json
]

[project.optional-dependencies]
html = ["selectolax>=0.3.0"]    # selectolax_compat 探测的内核（modest/lexbor）
embed = ["sentence-transformers>=2.2.0"]    # embeddings 的 local 语义后端（可选，模型权重另需下载）
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artesian = ["py.typed"]    # PEP 561：消费方 mypy 按真实类型分析，否则其返回值退化为 Any

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: 慢测试（默认运行，可用 -m 'not slow' 跳过）",
]

[tool.coverage.run]
source = ["artesian"]

[tool.coverage.report]
# 2026-10-07 实测 98.29%（125 条用例：embeddings 100%、knowledge_base 96%，
# 未覆盖者为 sqlite 自愈/embed 失败等慢路径分支）；门槛定 90 是给后续
# search_engines 迁移留缓冲，每次迁移落地后按实测上调。
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
implicit_optional = true
